name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: set up go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
        id: go

      - name: checkout
        uses: actions/checkout@v5

      - name: set up Node for frontend tests
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: fast verification
        run: make verify-fast

      - name: install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: browser verification
        run: make verify-e2e

      - name: upload browser verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: artifacts/e2e/
          if-no-files-found: ignore

      - name: build and test
        run: |
          go test -race -v -timeout=100s -covermode=atomic -coverprofile=$GITHUB_WORKSPACE/profile.cov_tmp ./...
          cat $GITHUB_WORKSPACE/profile.cov_tmp | grep -v "mocks" | grep -v "_mock" > $GITHUB_WORKSPACE/profile.cov

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0

      - name: submit coverage
        run: |
          go install github.com/mattn/goveralls@latest
          goveralls -service="github" -coverprofile=$GITHUB_WORKSPACE/profile.cov
        env:
          COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
