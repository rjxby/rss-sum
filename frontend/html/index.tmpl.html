<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="htmx-config" content='{"noSwap":[204,304,"4xx","5xx"],"includeIndicatorCSS":false}'>
    <title>RSS Sum</title>
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/app.js" defer></script>
    <script src="/static/htmx.min.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#latest-articles">Skip to articles</a>
    <main class="container">
        <header class="site-header">
            <a class="brand" href="/" aria-label="RSS Sum home">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <circle cx="5" cy="19" r="1" fill="currentColor" stroke="none" />
                    <path d="M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16" />
                </svg>
                RSS Sum
            </a>
            <span class="site-description">A digest of your feeds</span>
        </header>

        <section class="introduction" aria-labelledby="page-title">
            <p class="eyebrow">Your feeds, condensed</p>
            <h1 id="page-title">A little less scrolling.<br>A little more reading.</h1>
            <p class="introduction-text">Short summaries. Follow a story back to its source.</p>
        </section>

        <h2 class="section-heading" id="latest-articles">Latest articles</h2>
        <section id="posts-container" aria-labelledby="latest-articles" aria-busy="true" data-feed-request
            hx-get="/api/v1/posts?page=1&pageSize=10"
            hx-trigger="load, retry"
            hx-swap="innerHTML">
            <div class="feed-status" role="status" data-loading-message="Loading articles...">
                <span class="loading-spinner" aria-hidden="true"></span>
                <p data-status-text>Loading articles...</p>
                <button type="button" data-retry hidden>Try again</button>
            </div>
        </section>

        <noscript><p class="feed-status">Enable JavaScript to load articles.</p></noscript>

        <footer class="site-footer">
            <p>RSS Sum <span aria-hidden="true">·</span> {{ .Version }}</p>
        </footer>
    </main>
</body>
</html>
